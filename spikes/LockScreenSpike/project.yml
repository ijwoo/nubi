name: LockScreenSpike
options:
  bundleIdPrefix: dev.jaewoo.nubispike
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# 버릴 코드입니다. 슬라이스 1 이 무엇을 할 수 있는지만 확인하고, 결과는
# docs/ios-client-slices.md 로 옮긴 뒤 이 디렉터리는 지웁니다.
#
# 팀 ID 는 환경변수로 받습니다. 이 저장소는 공개이고, 서명 자료는 pip-any 의
# build-signing 에 있습니다 (ADR 0001).
#
#   NUBI_TEAM_ID=... xcodegen generate

targets:
  LockScreenSpike:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: SpikeWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Spike
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        # 이게 없으면 업로드는 되는데 빌드가 MISSING_EXPORT_COMPLIANCE 로 멈춰
        # TestFlight 앱에 아예 안 뜹니다. 스파이크는 암호화를 쓰지 않습니다.
        ITSAppUsesNonExemptEncryption: false
        # 조작 폰은 세로 고정이고, 스파이크도 같은 조건에서 봅니다.
        # 방향을 안 적으면 altool 이 iPad 멀티태스킹을 걸고 넘어집니다.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsFullAccessUsageDescription: 잠금화면에서 일정을 읽을 수 있는지 확인합니다.
        NSRemindersFullAccessUsageDescription: 잠금화면에서 미리알림을 쓸 수 있는지 확인합니다.
    entitlements:
      path: App/Spike.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.jaewoo.nubispike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jaewoo.nubispike
        # 아이폰만. iPad 를 켜두면 152x152 아이콘까지 요구합니다.
        TARGETED_DEVICE_FAMILY: "1"
        # 이 키가 있어야 CFBundleIconName 이 생깁니다 — 없으면 업로드가 거절됩니다.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ${NUBI_TEAM_ID}
        CURRENT_PROJECT_VERSION: ${SPIKE_BUILD}
        MARKETING_VERSION: "1.0"
      configs:
        # Xcode 로 폰에 직접 꽂을 때. 개발 프로파일은 Xcode 가 알아서 만듭니다.
        Debug:
          CODE_SIGN_STYLE: Automatic
        # TestFlight 로 올릴 때. 이 맥의 Xcode 에는 Apple 계정이 없어서
        # 자동 서명이 안 됩니다 — PiPAny 와 같은 수동 프로파일을 씁니다.
        Release:
          CODE_SIGN_STYLE: Manual
          # 키체인에 Apple Distribution 이 여러 장이다. 이름만 쓰면 Xcode 가
          # 아무거나 고르고, 잠긴 키체인의 것을 고르면 errSecInternalComponent 다.
          # 지문으로 못 박는다 — 팀 ID 와 같은 이유로 환경변수다.
          CODE_SIGN_IDENTITY: ${NUBI_SIGN_ID}
          PROVISIONING_PROFILE_SPECIFIER: NubiSpike_AppStore

  SpikeWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: SpikeWidget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSCalendarsFullAccessUsageDescription: 잠금화면에서 일정을 읽을 수 있는지 확인합니다.
        NSRemindersFullAccessUsageDescription: 잠금화면에서 미리알림을 쓸 수 있는지 확인합니다.
    entitlements:
      path: Widget/SpikeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.jaewoo.nubispike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jaewoo.nubispike.widget
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ${NUBI_TEAM_ID}
        CURRENT_PROJECT_VERSION: ${SPIKE_BUILD}
        MARKETING_VERSION: "1.0"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          # 키체인에 Apple Distribution 이 여러 장이다. 이름만 쓰면 Xcode 가
          # 아무거나 고르고, 잠긴 키체인의 것을 고르면 errSecInternalComponent 다.
          # 지문으로 못 박는다 — 팀 ID 와 같은 이유로 환경변수다.
          CODE_SIGN_IDENTITY: ${NUBI_SIGN_ID}
          PROVISIONING_PROFILE_SPECIFIER: NubiSpike_Widget_AppStore
